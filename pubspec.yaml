name: medimanager
description: "Offline medication intake tracking and optional local reminders."
publish_to: 'none'
version: 1.0.1+5

environment:
  sdk: ^3.13.0

dependencies:
  crypto: ^3.0.8
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  file_picker: ^13.3.2
  file_picker_web: ^4.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - LICENSE
    - assets/fonts/Roboto-LICENSE.txt
    - assets/images/medimanager.png
    - lib/l10n/app_de.arb
    - lib/l10n/app_en.arb
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
